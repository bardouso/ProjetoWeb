<div class="box">
    <h2>Cadastro de Cliente</h2>
    
    <input type="text" [(ngModel)]="obj.nome" placeholder="Nome">
    <input type="email" [(ngModel)]="obj.email" placeholder="Email">
    <input type="text" [(ngModel)]="obj.documento" placeholder="CPF ou RG">
    <input type="password" [(ngModel)]="obj.senha" placeholder="Senha">
    
    <textarea [(ngModel)]="obj.logradouro" placeholder="Endereço" rows="3"></textarea>
    
    <button type="button" (click)="cadastrar()">Cadastrar</button>
    
    <p>Já tem conta? <span [routerLink]="['/login']">Faça Login</span></p>
</div>
