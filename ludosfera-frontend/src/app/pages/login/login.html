<div class='box'>
    <h2>Login</h2><input [(ngModel)]='email' placeholder='Email'><input [(ngModel)]='senha' type='password'
        placeholder='Senha'><button (click)='fazerLogin()'>Entrar</button>
    <p class='erro'>{{mensagem}}</p>
    <p>Não tem conta? <span routerLink='/cadastro'>Cadastre-se</span></p>
    <p><span routerLink='/recupera'>Recuperar senha</span></p>
</div>
